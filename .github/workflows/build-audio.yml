name: Build dipper audio core and matching modules
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-audio.yml'
      - 'scripts/build-audio.sh'
permissions:
  contents: read
concurrency:
  group: dipper-audio
  cancel-in-progress: true
jobs:
  audio:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 python3 git curl zip
      - name: Build audio core, kernel and matching modules
        run: bash scripts/build-audio.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dipper-audio-experimental
          path: |
            artifacts/
            build.log
            wifi-build.log
            audio-build.log
          retention-days: 14
