name: Build dipper SukiSU builtin
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'stock/stock.config'
      - 'pins.json'
permissions:
  contents: read
concurrency:
  group: dipper-sukisu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses5 libtinfo5 python3 git curl zip
      - name: Build kernel
        run: bash scripts/build.sh
      - name: Upload kernel and build records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dipper-sukisu-builtin-${{ github.run_number }}
          path: |
            artifacts/
            build.log
          if-no-files-found: error
          retention-days: 30
