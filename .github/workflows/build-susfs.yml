name: Build dipper builtin drivers with SUSFS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-susfs.yml'
      - 'scripts/build-susfs.sh'
      - 'scripts/prepare-susfs.py'
      - 'scripts/susfs-query.c'
      - 'scripts/patches/susfs-4.9-dipper.patch'
      - 'scripts/prepare.py'
      - 'scripts/bootstrap-kernel.c'
      - 'scripts/bootstrap-ksud.sh'
permissions:
  contents: read
concurrency:
  group: dipper-susfs-experimental
  cancel-in-progress: true
jobs:
  builtin:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 python3 git curl zip
      - name: Build kernel with builtin audio and WLAN
        run: bash scripts/build-susfs.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dipper-susfs-experimental
          path: |
            artifacts/
            build.log
          retention-days: 14
