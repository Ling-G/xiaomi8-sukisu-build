name: Build matching dipper Wi-Fi module
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-wifi.yml'
      - 'scripts/build-wifi.sh'
permissions:
  contents: read
concurrency:
  group: dipper-wifi
  cancel-in-progress: true
jobs:
  wifi:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 python3 git curl zip
      - name: Build kernel and matching Wi-Fi module
        run: bash scripts/build-wifi.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dipper-wifi-experimental
          path: |
            artifacts/
            build.log
            wifi-build.log
          retention-days: 14
